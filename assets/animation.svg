<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Allow Gradient -->
    <linearGradient id="allow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    
    <!-- Deny Gradient -->
    <linearGradient id="deny-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
    
    <!-- Escalate Gradient -->
    <linearGradient id="escalate-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="24" />

  <!-- Background Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <path d="M 0,50 L 1000,50 M 0,100 L 1000,100 M 0,150 L 1000,150 M 0,200 L 1000,200 M 0,250 L 1000,250" />
    <path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300 M 900,0 L 900,300" />
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 50)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">
      AXON DECISION FLOW
    </text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
      Continuous Policy Verification
    </text>
  </g>

  <!-- Flow Paths -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <!-- Input to Engine -->
    <path d="M 150,150 L 350,150" stroke="#4F46E5" stroke-dasharray="8 6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite" />
    </path>
    <!-- Engine to Allow -->
    <path d="M 550,150 L 750,75" stroke="#059669" stroke-dasharray="8 6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite" />
    </path>
    <!-- Engine to Escalate -->
    <path d="M 550,150 L 750,150" stroke="#D97706" stroke-dasharray="8 6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite" />
    </path>
    <!-- Engine to Deny -->
    <path d="M 550,150 L 750,225" stroke="#DC2626" stroke-dasharray="8 6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Data Packets Flowing -->
  <g filter="url(#glow)">
    <circle r="4" fill="#ffffff">
      <animateMotion path="M 150,150 L 350,150" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <circle r="4" fill="#6EE7B7">
      <animateMotion path="M 550,150 L 750,75" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
    </circle>

    <circle r="4" fill="#FCD34D">
      <animateMotion path="M 550,150 L 750,150" dur="1.5s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.5s" begin="1s" repeatCount="indefinite" />
    </circle>

    <circle r="4" fill="#FCA5A5">
      <animateMotion path="M 550,150 L 750,225" dur="1.5s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.5s" begin="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Node: System Input -->
  <g transform="translate(150, 150)">
    <circle r="25" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <circle r="12" fill="#94A3B8">
      <animate attributeName="r" values="12;14;12" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="45" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">SYSTEM REQUEST</text>
  </g>

  <!-- Node: Decision Engine Kernel -->
  <g transform="translate(450, 150)">
    <circle r="55" fill="#1e1b4b" stroke="url(#node-gradient)" stroke-width="3" filter="url(#glow-strong)">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="35" fill="url(#node-gradient)" opacity="0.2">
      <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Internal Engine Pulse -->
    <path d="M-20,-10 L-10,-20 L10,-20 L20,-10 L20,10 L10,20 L-10,20 L-20,10 Z" fill="none" stroke="#818CF8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M-15,0 L-5,-10 L5,-10 L15,0 L15,10 L5,20 L-5,20 L-15,10 Z" fill="none" stroke="#A5B4FC" stroke-width="1.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite" />
    </path>
    
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">GEMINI</text>
    <text x="0" y="85" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#818CF8" text-anchor="middle" letter-spacing="1">POLICY KERNEL</text>
  </g>

  <!-- Output Nodes -->
  <!-- ALLOW -->
  <g transform="translate(750, 75)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#022c22" stroke="url(#allow-gradient)" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#34D399" text-anchor="middle">ALLOW</text>
    <circle cx="-40" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ESCALATE -->
  <g transform="translate(750, 150)">
    <rect x="-70" y="-20" width="140" height="40" rx="8" fill="#451a03" stroke="url(#escalate-gradient)" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FBBF24" text-anchor="middle">ESCALATE</text>
    <circle cx="-50" cy="0" r="4" fill="#F59E0B">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- DENY -->
  <g transform="translate(750, 225)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#450a0a" stroke="url(#deny-gradient)" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#F87171" text-anchor="middle">DENY</text>
    <circle cx="-40" cy="0" r="4" fill="#EF4444">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1.3s" repeatCount="indefinite" />
    </circle>
  </g>

</svg>
