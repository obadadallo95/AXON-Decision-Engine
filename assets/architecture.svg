<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AXON challenge architecture</title>
  <desc id="desc">Proposed action and context flow through validation, explicit signals, optional bounded Gemini interpretation, signal reconciliation, server-owned policy authority, a five-state decision, and a server audit record. Escalate creates a review event.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="kernel" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="48" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="25" font-weight="800" letter-spacing="2">AXON DECISION PATH</text>
  <text x="48" y="75" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Gemini reasons. AXON authorizes. Audit is server-owned and process-local for this prototype.</text>

  <g font-family="Inter, sans-serif" text-anchor="middle">
    <g fill="#0f172a" stroke="#38bdf8" stroke-width="2"><rect x="45" y="175" width="150" height="82" rx="14"/><text x="120" y="208" fill="#fff" font-size="14" font-weight="700">Proposed Action</text><text x="120" y="231" fill="#7dd3fc" font-size="12">+ Context</text></g>
    <g fill="#0f172a" stroke="#64748b" stroke-width="2"><rect x="235" y="175" width="150" height="82" rx="14"/><text x="310" y="208" fill="#fff" font-size="14" font-weight="700">Validation</text><text x="310" y="231" fill="#cbd5e1" font-size="12">Normalization</text></g>
    <g fill="#0f172a" stroke="#64748b" stroke-width="2"><rect x="425" y="175" width="150" height="82" rx="14"/><text x="500" y="208" fill="#fff" font-size="14" font-weight="700">Explicit</text><text x="500" y="231" fill="#cbd5e1" font-size="12">Signals</text></g>
    <g fill="#451a03" stroke="#f59e0b" stroke-width="2"><rect x="425" y="330" width="150" height="70" rx="14"/><text x="500" y="359" fill="#fbbf24" font-size="13" font-weight="700">Gemini</text><text x="500" y="380" fill="#fde68a" font-size="11">bounded advisory</text></g>
    <g fill="#1e1b4b" stroke="url(#kernel)" stroke-width="3"><rect x="615" y="160" width="190" height="112" rx="18"/><text x="710" y="198" fill="#fff" font-size="15" font-weight="800">Signal</text><text x="710" y="221" fill="#fff" font-size="15" font-weight="800">Reconciliation</text><text x="710" y="247" fill="#c7d2fe" font-size="11">server-owned boundary</text></g>
    <g fill="#1e1b4b" stroke="url(#kernel)" stroke-width="3"><rect x="845" y="160" width="190" height="112" rx="18"/><text x="940" y="198" fill="#fff" font-size="15" font-weight="800">Policy</text><text x="940" y="221" fill="#fff" font-size="15" font-weight="800">Authority</text><text x="940" y="247" fill="#c7d2fe" font-size="11">server-owned rules</text></g>
    <g fill="#064e3b" stroke="#34d399" stroke-width="2"><rect x="1070" y="160" width="105" height="112" rx="14"/><text x="1122" y="194" fill="#fff" font-size="13" font-weight="800">Five</text><text x="1122" y="214" fill="#fff" font-size="13" font-weight="800">States</text><text x="1122" y="240" fill="#a7f3d0" font-size="10">decision</text></g>
    <g fill="#0f172a" stroke="#34d399" stroke-width="2"><rect x="845" y="350" width="190" height="70" rx="14"/><text x="940" y="380" fill="#fff" font-size="14" font-weight="700">Server Audit Record</text><text x="940" y="401" fill="#a7f3d0" font-size="11">before return</text></g>
    <g fill="#312e81" stroke="#a5b4fc" stroke-width="2"><rect x="1070" y="350" width="105" height="70" rx="14"/><text x="1122" y="380" fill="#fff" font-size="13" font-weight="700">Review</text><text x="1122" y="401" fill="#c7d2fe" font-size="11">ESCALATE only</text></g>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M195 216h40"/><path d="M385 216h40"/><path d="M575 216h40"/><path d="M805 216h40"/><path d="M1035 216h35"/>
    <path d="M500 330v-70" stroke="#f59e0b"/><path d="M710 272v78"/><path d="M1035 385h35"/>
  </g>
  <text x="48" y="480" fill="#64748b" font-family="Inter, sans-serif" font-size="12">No Firestore or client-side metric source is authoritative in the challenge runtime.</text>
</svg>
